<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fahrrad-Werkstatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEEE9; --sheet:#F8F9F6; --ink:#1D2528; --ink2:#566166; --line:#C8CDC6;
  --sig:#F2B705; --hl:#D39300; --steel:#2C6670; --warn:#A33B2C; --warnbg:#F3E3DF;
  --cond:"Barlow Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14181A; --sheet:#1D2327; --ink:#E4E8E2; --ink2:#9AA6A9; --line:#343C40;
    --hl:#F2B705; --steel:#7FBFC4; --warn:#E58474; --warnbg:#2E1F1C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14181A; --sheet:#1D2327; --ink:#E4E8E2; --ink2:#9AA6A9; --line:#343C40;
  --hl:#F2B705; --steel:#7FBFC4; --warn:#E58474; --warnbg:#2E1F1C; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--cond);line-height:1.1;margin:0}
a{color:var(--steel)}
:focus-visible{outline:3px solid var(--steel);outline-offset:2px}

.top{max-width:760px;margin:0 auto;padding:14px 18px 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:700;letter-spacing:.01em}
.top p{margin:0;color:var(--ink2);font-size:14px}
.top .switch{border:0;border-left:1px solid var(--line);background:none;margin:-6px 0 -6px 8px;padding:6px 0 6px 9px;font-size:14px;font-weight:600;color:var(--steel);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.top .switch[hidden]{display:none}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.view[hidden]{display:none}

/* ---------- Rad ---------- */
.stage{max-width:760px;margin:0 auto;background:var(--paper)}
.stage svg{display:block;width:100%;height:auto;aspect-ratio:1000/810;touch-action:manipulation}
.rad.detail .stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:36vh;min-height:220px;max-height:360px;border-bottom:1px solid var(--line)}
.rad.detail .stage svg{height:100%;aspect-ratio:auto}
.hint{max-width:760px;margin:0 auto;padding:0 18px;color:var(--ink2);font-size:14px}
.rad.detail .hint{display:none}

svg .part{color:var(--ink);cursor:pointer;transition:color .2s}
svg .part.on{color:var(--hl);filter:drop-shadow(0 0 5px rgba(242,183,5,.75))}
svg .ground{stroke:var(--line);stroke-width:3}
svg .spk{stroke:currentColor;stroke-width:1.6;opacity:.55}
svg .lead{stroke:var(--ink2);stroke-width:2}
svg .dot{fill:var(--sheet);stroke:var(--ink);stroke-width:3;cursor:pointer}
svg .dot.on{fill:var(--sig);stroke-width:4}
svg .lbl{cursor:pointer}
svg .lbl rect{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
svg .lbl text{font-family:var(--cond);font-weight:600;font-size:34px;fill:var(--ink)}
svg .lbl.on rect{fill:var(--sig)}
svg .lbl.on text{fill:#1D2528}
.rad.detail svg .lbl,.rad.detail svg .lead{display:none}
.rad:not(.detail) svg .dot{display:none}
svg .deco{fill:none;stroke:var(--ink2);stroke-width:5;stroke-linecap:round;opacity:.45;pointer-events:none}

.panel{max-width:760px;margin:0 auto;padding:12px 18px 24px}
.groups h2{font-size:15px;font-weight:600;color:var(--ink2);margin:22px 0 6px;font-family:var(--body)}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows li{border-bottom:1px solid var(--line)}
.rows button{all:unset;box-sizing:border-box;display:flex;width:100%;padding:12px 2px;gap:12px;align-items:center;cursor:pointer}
.rows button:focus-visible{outline:3px solid var(--steel)}
.rows .nm{font-family:var(--cond);font-weight:600;font-size:21px;flex:0 0 auto}
.rows .ds{color:var(--ink2);font-size:14px;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows svg{flex:0 0 auto;color:var(--ink2)}
.disclaimer{margin-top:26px;font-size:13px;color:var(--ink2);border-left:3px solid var(--line);padding-left:12px}

.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 14px}
.dhead .grp{margin:0;color:var(--ink2);font-size:14px}
.dhead h2{font-size:34px;font-weight:700}
.back{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer;flex:0 0 auto}

.seg{display:flex;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:600;cursor:pointer;font-size:15px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

.tabbody h3{font-size:21px;font-weight:600;margin:20px 0 6px}
.tabbody p{margin:0 0 10px;max-width:68ch}
.tabbody ul{margin:0;padding-left:20px}
.tabbody li{margin:4px 0}
.lead-p{font-size:18px}

details.task{background:var(--sheet);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
details.task summary{list-style:none;padding:13px 14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
details.task summary::-webkit-details-marker{display:none}
details.task summary .tt{font-family:var(--cond);font-weight:600;font-size:20px}
details.task summary .iv{grid-column:1/-1;color:var(--ink2);font-size:14px}
details.task[open] summary{border-bottom:1px solid var(--line)}
.tbody{padding:12px 14px 14px}
.tbody ol{margin:0 0 12px;padding-left:22px}
.tbody ol li{margin:6px 0;padding-left:2px}
.note{background:var(--paper);border-radius:10px;padding:10px 12px;font-size:15px;margin-top:10px}
.shop{border:2px solid var(--warn);background:var(--warnbg);border-radius:14px;padding:12px 14px;margin-top:18px}
.shop h3{color:var(--warn);margin-top:0;font-size:19px}
.shop p{margin:0}

.lv{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;white-space:nowrap}
.lv i{display:inline-block;width:8px;height:14px;border-radius:2px;background:var(--line)}
.lv span{display:inline-flex;gap:2px}
.lv1 i:nth-child(-n+1),.lv2 i:nth-child(-n+2),.lv3 i:nth-child(-n+3){background:var(--ink)}
.lv3{color:var(--warn)} .lv3 i:nth-child(-n+3){background:var(--warn)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.have::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--steel)}
.chips-l{font-size:14px;color:var(--ink2);margin:8px 0 0}

.term{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted var(--steel);text-decoration-thickness:2px;text-underline-offset:3px;cursor:help}

.dfoot{margin-top:26px;display:grid;gap:10px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer;font-size:15px}
.btn.ghost{background:var(--sheet);color:var(--ink);border-color:var(--line)}
.pn{display:flex;gap:10px}
.pn .btn{flex:1;font-family:var(--cond);font-size:17px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* checkbox lists */
.cl{list-style:none;padding:0;margin:0}
.cl li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.cl li:last-child{border-bottom:0}
.cl input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--steel);flex:0 0 auto}
.cl label{flex:1;cursor:pointer}
.cl small{display:block;color:var(--ink2);font-size:14px}

/* ---------- Inspektion ---------- */
.vhead{max-width:760px;margin:0 auto;padding:6px 18px 0}
.vhead h2{font-size:32px;font-weight:700}
.vhead p{color:var(--ink2);max-width:62ch;margin:6px 0 0}
.prog{height:10px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:14px 0 4px}
.prog div{height:100%;background:var(--sig);transition:width .25s}
.progt{font-size:14px;color:var(--ink2)}
details.step{background:var(--sheet);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
details.step summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px}
details.step summary::-webkit-details-marker{display:none}
.num{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:18px}
details.step.done .num{background:var(--sig);border-color:var(--sig);color:#1D2528}
.st{flex:1}
.st b{display:block;font-family:var(--cond);font-weight:600;font-size:20px;line-height:1.15}
.st small{color:var(--ink2);font-size:14px}
.sbody{padding:4px 14px 14px;border-top:1px solid var(--line)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.links .chip{background:var(--sheet);border-color:var(--steel);color:var(--steel);font-weight:600}

/* ---------- Start ---------- */
.bikes{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.bikecard{all:unset;box-sizing:border-box;display:flex;gap:14px;align-items:center;width:100%;padding:14px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.bikecard:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.bikecard.on{border-color:var(--hl);box-shadow:inset 0 0 0 1px var(--hl)}
.bikecard svg{flex:0 0 auto;width:104px;height:auto;color:var(--ink)}
.bikecard .bt{flex:1;min-width:0}
.bikecard .bn{display:block;font-family:var(--cond);font-weight:700;font-size:25px;line-height:1.1}
.bikecard .bd{display:block;color:var(--ink2);font-size:14px;margin-top:3px}
.bikecard .bf{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.bikecard .bf span{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:1px 9px;font-size:13px}
.bikecard .act{display:block;margin-top:8px;font-size:13px;font-weight:600;color:var(--steel)}
.groups details.task{margin-top:14px}
@media (max-width:380px){.bikecard svg{width:78px}}

/* ---------- Werkzeug / Begriffe ---------- */
.tsec h3{font-size:22px;font-weight:600;margin:24px 0 2px}
.tsec > p{margin:0 0 6px;color:var(--ink2);font-size:14px}
.gl dt{font-family:var(--cond);font-weight:600;font-size:21px;margin-top:16px}
.gl dd{margin:2px 0 0;max-width:66ch}

/* ---------- Nav ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs[hidden]{display:none}
.tabs .in{display:flex;width:100%;max-width:760px}
.tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{color:var(--hl)}

/* ---------- Sheet & Toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--sheet);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto;max-width:760px;margin:0 auto;box-shadow:0 -6px 30px rgba(0,0,0,.18)}
.sheet h3{font-size:24px;font-weight:600;margin-bottom:6px}
.sheet p{margin:0 0 12px}
.sheet textarea{width:100%;height:42vh;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);color:var(--ink)}
.scrim[hidden],.sheet[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-weight:600;z-index:50;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:900px){
  .rad.detail .stage{height:44vh;max-height:460px}
}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ECEEE9">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<header class="top">
  <h1>Fahrrad-Werkstatt</h1>
  <p><span id="sub">für Gravel- und Rennräder</span><button class="switch" id="switch" data-go="#/start" hidden>Rad wechseln</button></p>
</header>

<main>
  <!-- ===================== RAD ===================== -->
  <section class="view rad" id="v-rad">
    <div class="stage" id="stage">
      <svg id="bike" viewBox="0 0 1000 810" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Schematische Seitenansicht eines Gravelbikes mit tippbaren Bauteilen">
        <line class="ground" x1="0" y1="722" x2="1000" y2="722"/>

        <!-- ===== Gravelbike ===== -->

          <g id="spokesR"></g><g id="spokesF"></g>
          <circle cx="215" cy="530" r="165" fill="none" stroke="currentColor" stroke-width="10"/>
          <circle cx="785" cy="530" r="165" fill="none" stroke="currentColor" stroke-width="10"/>

          <circle cx="785" cy="530" r="15" fill="currentColor"/>
        </g>

        <g class="part" id="g-reifen" data-part="reifen">
          <circle cx="215" cy="530" r="181" fill="none" stroke="currentColor" stroke-width="22" opacity=".9"/>
          <circle cx="785" cy="530" r="181" fill="none" stroke="currentColor" stroke-width="22" opacity=".9"/>
          <circle cx="215" cy="530" r="193" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="3 8"/>
          <circle cx="785" cy="530" r="193" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="3 8"/>
          <rect x="211" y="364" width="8" height="20" rx="2" fill="currentColor"/>
        </g>

        <g class="part" id="g-bremse" data-part="bremse">
          <circle cx="785" cy="530" r="44" fill="none" stroke="currentColor" stroke-width="5"/>
          <circle cx="785" cy="530" r="34" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="5 6"/>
          <circle cx="785" cy="530" r="22" fill="none" stroke="currentColor" stroke-width="3"/>
          <rect x="-19" y="-11" width="38" height="22" rx="6" fill="currentColor" transform="translate(745,491) rotate(62)"/>
          <rect x="-19" y="-11" width="38" height="22" rx="6" fill="currentColor" transform="translate(258,503) rotate(-12)"/>
          <path d="M744,478 Q716,408 694,336" fill="none" stroke="currentColor" stroke-width="3.5"/>
          <path d="M262,494 Q350,520 440,556" fill="none" stroke="currentColor" stroke-width="3"/>
        </g>

        <g class="part" id="g-rahmen" data-part="rahmen" stroke="currentColor" stroke-linecap="round">
          <line x1="450" y1="568" x2="215" y2="530" stroke-width="13"/>
          <line x1="215" y1="530" x2="378" y2="326" stroke-width="10"/>
          <line x1="450" y1="568" x2="369" y2="294" stroke-width="18"/>
          <line x1="381" y1="335" x2="664" y2="258" stroke-width="16"/>
          <line x1="450" y1="568" x2="684" y2="312" stroke-width="22"/>
          <line x1="662" y1="244" x2="689" y2="322" stroke-width="27" stroke-linecap="butt"/>
          <circle cx="215" cy="530" r="12" fill="currentColor" stroke="none"/>
        </g>

        <g class="part" id="g-gabel" data-part="gabel">
          <path d="M688,320 Q742,414 785,530" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>
          <circle cx="785" cy="530" r="10" fill="currentColor"/>
        </g>

        <g class="part" id="g-kassette" data-part="kassette" fill="none" stroke="currentColor" stroke-width="3">
          <circle cx="215" cy="530" r="19"/><circle cx="215" cy="530" r="24"/><circle cx="215" cy="530" r="29"/>
          <circle cx="215" cy="530" r="34"/><circle cx="215" cy="530" r="39"/><circle cx="215" cy="530" r="44"/>
          <circle cx="215" cy="530" r="49"/><circle cx="215" cy="530" r="54"/>
        </g>

        <g class="part" id="g-kurbel" data-part="kurbel">
          <circle cx="450" cy="568" r="46" fill="none" stroke="currentColor" stroke-width="7"/>
          <circle cx="450" cy="568" r="51" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="3 4"/>
          <line x1="450" y1="568" x2="528" y2="616" stroke="currentColor" stroke-width="15" stroke-linecap="round"/>
        </g>

        <g class="part" id="g-kette" data-part="kette" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="7 3">
          <path d="M450,517 L215,497"/>
          <path d="M450,619 L208,644 M198,634 L222,578 L212,564"/>
        </g>

        <g class="part" id="g-schaltwerk" data-part="schaltwerk">
          <path d="M218,534 L244,552 L250,572 L234,580 L222,560 Z" fill="currentColor"/>
          <path d="M228,568 L246,582 L218,648 L196,636 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="232" cy="578" r="9" fill="var(--paper)" stroke="currentColor" stroke-width="4"/>
          <circle cx="208" cy="634" r="9" fill="var(--paper)" stroke="currentColor" stroke-width="4"/>
        </g>

        <g class="part" id="g-tretlager" data-part="tretlager">
          <circle cx="450" cy="568" r="18" fill="currentColor"/>
          <circle cx="450" cy="568" r="7" fill="var(--paper)"/>
        </g>

        <g class="part" id="g-pedal" data-part="pedal">
          <rect x="506" y="609" width="44" height="15" rx="4" fill="currentColor"/>
          <circle cx="528" cy="616" r="5" fill="var(--paper)"/>
        </g>

        <g class="part" id="g-steuersatz" data-part="steuersatz">
          <rect x="-20" y="-6" width="40" height="12" rx="3" fill="currentColor" transform="translate(660,239) rotate(-19)"/>
          <rect x="-20" y="-6" width="40" height="12" rx="3" fill="currentColor" transform="translate(691,327) rotate(-19)"/>
        </g>

        <g class="part" id="g-vorbau" data-part="vorbau">
          <rect x="-15" y="-8" width="30" height="16" rx="2" fill="currentColor" opacity=".8" transform="translate(656,226) rotate(-19)"/>
          <rect x="-13" y="-4" width="26" height="8" rx="2" fill="currentColor" transform="translate(651,210) rotate(-19)"/>
          <line x1="652" y1="219" x2="712" y2="214" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>
          <circle cx="712" cy="214" r="13" fill="currentColor"/>
        </g>

        <g class="part" id="g-lenker" data-part="lenker">
          <path d="M712,214 C738,212 762,212 778,222 C796,234 800,268 788,286 C780,298 762,300 748,296" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
        </g>

        <g class="part" id="g-hebel" data-part="hebel">
          <path d="M766,231 C742,254 708,248 686,272" fill="none" stroke="currentColor" stroke-width="4"/>
          <path d="M770,233 C750,262 716,262 692,286" fill="none" stroke="currentColor" stroke-width="4"/>
          <path d="M757,214 C766,199 790,201 797,213 L801,228 C792,235 777,233 767,229 Z" fill="currentColor"/>
          <path d="M797,226 C805,252 809,282 803,306" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
        </g>

        <g class="part" id="g-stuetze" data-part="stuetze">
          <line x1="369" y1="294" x2="346" y2="214" stroke="currentColor" stroke-width="13" stroke-linecap="round"/>
          <rect x="-14" y="-6" width="28" height="12" rx="2" fill="currentColor" transform="translate(372,302) rotate(-16)"/>

const GLOSS = {
  'Schaltauge':'Kleines, austauschbares Metallteil zwischen Rahmen und Schaltwerk. Es verbiegt sich bei einem Sturz absichtlich zuerst und schützt so den Rahmen. Meist modellspezifisch – ein Ersatz-Schaltauge lohnt sich für längere Touren.',
  'Schaltröllchen':'Die zwei kleinen Zahnräder im Schaltwerk. Das obere führt die Kette auf das gewählte Ritzel, das untere hält die Kette unter Spannung.',
  'Steckachse':'Dicke Achse, die durch Ausfallende und Nabe geschraubt wird. Steifer und sicherer positioniert als ein Schnellspanner. Das Anzugsmoment steht meist auf der Achse.',
  'Schnellspanner':'Ältere Radbefestigung mit dünner Achse und Hebel. Der Hebel muss sich beim Schließen deutlich schwer drücken lassen, sonst ist er zu locker.',
  'Ahead-Steuersatz':'Heute übliche Bauart: Der Vorbau klemmt direkt auf den Gabelschaft. Die Schraube oben in der Kappe stellt nur das Lagerspiel ein – festgehalten wird alles von den Klemmschrauben des Vorbaus.',
  'Spacer':'Distanzringe auf dem Gabelschaft unter oder über dem Vorbau. Durch Umsetzen ändert man die Lenkerhöhe.',
  'Anschlagschrauben':'Zwei Schrauben am Schaltwerk, meist mit H (high, kleinstes Ritzel) und L (low, größtes Ritzel) beschriftet. Sie begrenzen, wie weit das Schaltwerk nach außen und innen darf, damit die Kette nicht herunterfällt oder in die Speichen gerät.',
  'Zugspannung':'Wie straff der Schaltzug ist. Über eine Einstellschraube (am Schaltwerk, am Hebel oder im Zug) feinjustiert. Sie entscheidet, ob jeder Klick genau einen Gang sauber trifft.',
  'B-Schraube':'Stellt den Abstand zwischen oberem Schaltröllchen und Kassette ein. Wichtig für sauberes Schalten auf den großen Ritzeln.',

  'Entlüften':'Luft aus einer hydraulischen Bremse entfernen und das Medium erneuern. Braucht ein passendes Kit, das richtige Medium und Sorgfalt.',

  'Mineralöl und DOT':'Die zwei Bremsflüssigkeiten bei hydraulischen Scheibenbremsen. Shimano nutzt Mineralöl, SRAM DOT-Flüssigkeit. Niemals mischen oder verwechseln – das zerstört die Dichtungen.',

  'Felgenband':'Band im Felgenbett, das die Speichenlöcher abdeckt. Verrutscht oder beschädigt, kann es Platten von innen verursachen.',
  'Newtonmeter':'Einheit für das Anzugsdrehmoment (Nm). Steht oft direkt auf dem Bauteil, z. B. „5 Nm max".',
  'Freilauf':'Mechanismus in der Hinterradnabe, der beim Rollen ohne Treten das typische Klickern macht. Darauf sitzt die Kassette – Kassette und Freilaufkörper müssen zum gleichen Standard passen.',

const GLOSS_B = {
  'Faltgelenk':'Scharnier im Hauptrahmen und am Lenkervorbau. Es dreht sich um einen Stahlbolzen und wird mit einem Klemmhebel und einer Klemmplatte geschlossen. Beim Fahren muss der Hebel immer fest zugedreht sein.',
  'Klemmplatte':'Die Metallplatte am Faltgelenk, die der Klemmhebel gegen die beiden Gelenkhälften zieht. Sie nutzt sich mit der Zeit ab. Laut Brompton ist sie zu tauschen, wenn sie die Gelenkhälften fast berührt.',
  'Federelement':'Elastomer-Puffer zwischen Hinterbau und Hauptrahmen (englisch „suspension block"). Federt kleine Stöße ab und trägt den ausgeklappten Hinterbau. Es gibt verschiedene Härten.',

  'Felgenbremse':'Bremse, bei der zwei Beläge seitlich auf die Felge drücken. Leicht und einfach zu warten, bei Nässe aber weniger bissig als eine Scheibenbremse. Das Brompton C Line nutzt Doppelgelenkbremsen („Dual Pivot").',
  'Felgenverschleiß':'Felgenbremsen schleifen bei jeder Bremsung auch ein wenig die Felge ab. Wird die Bremsflanke zu dünn, kann die Felge durch den Reifendruck aufplatzen. Manche Felgen haben eine Verschleißmarkierung; im Zweifel misst der Händler die Wandstärke.',
  'Vorspur':'Den Bremsbelag so ausrichten, dass sein vorderes Ende (in Fahrtrichtung) die Felge einen Hauch früher berührt als das hintere. Das verringert Quietschen. Brompton-Beläge haben dafür laut Datenblatt drei kleine Erhebungen am hinteren Ende.',
  'Schrader und Presta':'Zwei Ventiltypen. Schrader ist das Autoventil, dick und mit Federstift. Presta (auch Sclaverand oder französisch) ist schlanker und hat eine Rändelmutter, die man vor dem Pumpen aufdreht. Am Brompton findet man oft Schrader, je nach Schlauch auch Presta.',
  'Gewindesteuersatz':'Ältere Steuersatz-Bauart: Eine Lagerschale wird auf den Gabelschaft mit Gewinde geschraubt und mit einer Kontermutter gesichert. Beim Brompton braucht man dafür laut Händlern zwei flache 36-mm-Schlüssel.',
  'Achsmutter':'Mutter, die ein Laufrad im Ausfallende hält – beim Brompton statt Schnellspanner oder Steckachse, meist mit 15-mm-Schlüssel. Darunter sitzen Sicherungsscheiben mit einer Nase, die ins Ausfallende greift.',
  'Sattelstützenführung':'Kunststoffhülse oben im Sitzrohr, in der die Sattelstütze gleitet. Sie nutzt sich ab. Laut Brompton ist sie fällig, wenn sich die Stütze nur noch schwer verstellen lässt oder an der Klemmschraube vier oder mehr Gewindegänge zu sehen sind.'
};

    note:'Brompton hat dazu eine eigene Support-Seite („Adjusting and replacing the suspension block"). Die Handgriffe im Detail kenne ich nicht sicher – schau sie dir vorher an, auch welches Werkzeug die Schraube braucht.'}
  ],
  shop:'Der Hinterbau lässt sich trotz neuem Federelement seitlich bewegen – dann ist eher das Drehgelenk verschlissen.'},

 {id:'hinterbau',n:'Hinterbau',g:'Faltmechanik',a:[250,566],l:[120,420],z:[305,560],zw:360,
  short:'Klappt mit dem Hinterrad unter den Rahmen',
  what:'Der hintere Rahmenteil, der das Hinterrad hält. Beim Falten schwenkt er samt Rad unter den Hauptrahmen.',
  how:'Der {{Hinterbau}} ist über ein Drehgelenk nahe am Tretlager mit dem Hauptrahmen verbunden. Ausgeklappt liegt er oben am {{Federelement}} an. An ihm sitzen Hinterrad, {{Kettenspanner}}, hintere Bremse und je nach Ausstattung Schutzblech mit Rollen und Gepäckträger. Seit Modelljahr 2025 hat das C Line laut Händlern einen neuen Hinterbau für die 4- und 12-Gang-Schaltung – Ersatzteile sind daher nicht immer zwischen den Baujahren tauschbar.',
  wear:['Seitliches Spiel am Hinterrad, wenn der Hinterbau frei hängt','Knacken oder Knarzen beim Treten aus dem Bereich hinter dem Tretlager','Rollen am Schutzblech oder Gepäckträger blockieren oder sind abgefahren'],
  tasks:[
   {t:'Drehgelenk auf Spiel prüfen',lv:1,iv:'bei jeder Inspektion',
    steps:['Rad anheben und den Hinterbau aus der Verriegelung lösen, sodass er frei hängt.','Hauptrahmen festhalten und versuchen, den Hinterbau gegen den Rahmen zu verdrehen oder das Hinterrad quer zur Fahrtrichtung zu drücken.','Es soll kein Spiel spürbar sein.'],
    tools:[],
    note:'Eine offizielle Toleranz habe ich nicht gefunden. Wenn du dir unsicher bist, ob das schon Spiel ist: beim Händler prüfen lassen.'},
   {t:'Rollen prüfen und reinigen',lv:1,iv:'gelegentlich – nur wenn dein Brompton Rollen hat',
    steps:['Rollen am Schutzblech bzw. Gepäckträger drehen: Laufen sie frei?','Haare und Dreck von den Achsen entfernen.','Befestigungsschrauben prüfen.'],
    tools:['lappen','inbus']}
  ],
  shop:'Spiel oder Knacken im Drehgelenk des Hinterbaus – der Lagertausch braucht Spezialwerkzeug und ist Händlersache.'},

 /* -------- ANTRIEB -------- */
 {id:'kette',n:'Kette',g:'Antrieb',a:[360,551],l:[500,510],z:[320,590],zw:380,
  short:'Überträgt deine Kraft aufs Hinterrad',
  what:'Die Kette überträgt die Kraft vom Kettenblatt vorne auf das Ritzel hinten.',
  how:'Unten läuft sie durch den {{Kettenspanner}}, der sie auf Spannung hält. Welche Kette passt, hängt von Schaltung und Baujahr ab: Ältere Bromptons haben laut Händlern eine breitere 1/8-Zoll-Kette, viele neuere eine 3/32-Zoll-Kette. Für die 4- und 12-Gang-Schaltung ab 2025 habe ich keine verlässliche Angabe gefunden. Mit der Zeit längt sich jede Kette ({{Kettenlängung}}) und nutzt dann Ritzel und Kettenblatt ab.',
  wear:['Kettenverschleißlehre zeigt Längung über der Grenze','Einzelne steife Glieder – die Kette springt oder rattert','Rost, Quietschen, trockenes Klackern','Kette springt beim kräftigen Antritt über die Zähne'],
  tasks:[
   {t:'Reinigen und ölen',lv:1,iv:'laut Brompton etwa monatlich, nach Regenfahrten öfter',
    steps:['Kette mit einem Lappen abziehen, während du die Pedale rückwärts drehst. Bei starkem Dreck vorher mit Entfetter einsprühen und abbürsten.','Gut trocknen lassen.','Pro Rolle einen Tropfen Öl auf die Innenseite der Kette geben, dabei langsam rückwärts kurbeln.','Ein paar Minuten einziehen lassen und dann außen gründlich abwischen. Beim gefalteten Rad liegt die Kette nah an Hose und Gepäck – je trockener außen, desto weniger Flecken.'],
    tools:['lappen','reiniger','oel','handschuhe'],
    note:'Kein Öl auf Felgen und Bremsbeläge – bei Felgenbremsen bremst das Rad sonst deutlich schlechter.'},
   {t:'Verschleiß messen',lv:1,iv:'alle paar Monate und bei jeder Inspektion',
    steps:['Kettenverschleißlehre zwischen zwei Rollen einsetzen und auf die Kette legen.','Für Ketten wie diese wird oft 0,75 % als Tauschgrenze genannt. Was deine Lehre und der Kettenhersteller angeben, hat Vorrang.','An zwei, drei Stellen messen.'],
    tools:['kettenlehre'],
    note:'Rechtzeitig tauschen spart Geld: Mit einer stark gelängten Kette nutzen sich Ritzel und Kettenblatt mit ab.'},
   {t:'Kette wechseln',lv:2,iv:'wenn die Verschleißgrenze erreicht ist',
    steps:['Passende Kette besorgen: Breite und Länge hängen von Schaltung, Kettenblatt und Ritzeln ab. Am sichersten fragst du beim Händler nach der Brompton-Ersatzkette für dein Modell.','Vorher ein Foto machen, wie die Kette durch den Kettenspanner läuft.','Alte Kette am Kettenschloss öffnen oder mit dem Kettennieter trennen.','Neue Kette auf Länge bringen: Glieder der alten Kette zählen und gleich viele nehmen – nicht die Länge vergleichen, die alte ist ja gelängt.','Einfädeln wie auf dem Foto: aufs Kettenblatt, aufs Ritzel und durch die Röllchen des Kettenspanners. Kettenschloss schließen.','Alle Gänge durchschalten, das Rad einmal falten und entfalten und prüfen, dass die Kette nirgends abspringt.'],
    tools:['schlosszange','kettennieter','kettenlehre','lappen','oel'],
    note:'Laut einem Händler kommt die Brompton-Ersatzkette mit einem Kettenschloss, das sich ohne Nietwerkzeug öffnen und schließen lässt. Prüf das bei deiner Kette.'}
  ],
  shop:'Die Kette springt auch nach dem Wechsel: Dann sind meist Ritzel oder Kettenblatt verschlissen – oder Kettenspanner bzw. Schaltung sind verstellt.'},

 {id:'spanner',n:'Kettenspanner & Kettenschaltung',lab:'Kettenspanner',g:'Antrieb',a:[242,653],l:[150,782],z:[232,640],zw:200,
  short:'Hält die Kette straff, schaltet bei manchen Modellen',
  what:'Der federnde Arm mit zwei Röllchen unter der Hinterachse hält die Kette straff. Bei Modellen mit mehreren Ritzeln hinten gehört er zur Kettenschaltung.',
  how:'Der {{Kettenspanner}} ist nötig, weil sich der Hinterbau beim Federn und Falten bewegt und die Kette trotzdem gespannt bleiben muss. Wie viel Technik hier steckt, hängt von der Schaltung ab: Beim 3-Gang spannt er nur. Beim 2- und 6-Gang (bis Modelljahr 2024) schiebt ein {{Kettenschieber}} die Kette zwischen zwei Ritzeln hin und her. Das 4- und 12-Gang (ab 2025) hat stattdessen ein kleines Brompton-Schaltwerk für vier Ritzel.',
  wear:['Röllchen verdreckt, wackeln oder haben abgenutzte Zähne','Kette hängt durch oder springt beim Falten ab','Gänge springen oder kommen zögerlich (2-, 4-, 6- und 12-Gang)','Spannarm verbogen, etwa nach dem Umfallen auf die rechte Seite'],
  tasks:[
   {t:'Röllchen reinigen und Feder prüfen',lv:1,iv:'bei jeder Kettenpflege',
    steps:['Kette langsam rückwärts kurbeln und mit Lappen oder alter Zahnbürste die Dreckringe von beiden Röllchen entfernen.','Prüfen, ob sich die Röllchen frei drehen und kein Spiel haben.','Spannarm ein Stück bewegen und loslassen: Er muss von selbst zurückfedern.'],
    tools:['lappen','reiniger']},
   {t:'Kettenschieber nachstellen (2- und 6-Gang)',lv:2,iv:'wenn der Wechsel zwischen den zwei Ritzeln hakt',
    steps:['Zuerst prüfen, ob Kettenschieber und Spannarm sauber sind und sich frei bewegen. Dreck in den Anschlägen ist laut Erfahrungsberichten eine häufige Ursache.','Dann die {{Zugspannung}} in kleinen Schritten an der Einstellmöglichkeit am Schalthebel bzw. am Zug anpassen.','Nach jeder Änderung beide Gänge mehrfach schalten, am besten unter leichter Last.'],
    tools:['lappen','reiniger'],
    note:'Die Anschlagschrauben des Kettenschiebers lasse ich hier bewusst weg – Brompton hat dafür ein eigenes Datenblatt. Ohne das lieber zum Händler.'},
   {t:'Schaltwerk nachstellen (4- und 12-Gang)',lv:2,iv:'wenn Gänge auf den vier Ritzeln nicht sauber kommen',
    steps:['Die häufigste Ursache ist laut Brompton eine zu geringe Zugspannung, etwa weil sich ein neuer Zug gelängt hat.','Aufs kleinste Ritzel schalten. Die Einstellschraube am Zug eine halbe Umdrehung herausdrehen – das erhöht die Zugspannung.','Durch alle vier Ritzel schalten. Klettert die Kette zu zögerlich auf größere Ritzel: weiter herausdrehen. Kommt sie zu spät aufs kleinere Ritzel zurück: wieder etwas hineindrehen.','Zum Schluss Probefahrt unter Last.'],
    tools:[],
    note:'So beschreibt Brompton das Nachstellen der 4-Gang-Kettenschaltung. Die {{Anschlagschrauben}} nur nach Herstellerangabe verstellen.'}
  ],
  shop:'Spannarm oder Schaltwerk verbogen, der Kettenschieber lässt sich nicht einstellen, oder du bist dir nicht sicher, welche Schaltung du hast.'},

 {id:'nabe',n:'Nabenschaltung',lab:'Nabe',g:'Antrieb',a:[200,602],l:[360,782],z:[205,600],zw:180,
  short:'Drei Gänge in der Hinterradnabe (3-, 6- und 12-Gang)',
  what:'Beim 3-, 6- und 12-Gang-Brompton stecken drei Gänge im Inneren der Hinterradnabe. Das 2- und 4-Gang-Brompton hat keine Nabenschaltung – dann kannst du diesen Teil überspringen.',
  how:'Die {{Nabenschaltung}} ist gegen Dreck geschützt und lässt sich auch im Stand schalten. Der Schaltzug zieht über das {{Schaltkettchen}} rechts an der Achse einen Stift in der Nabe hin und her. Damit jeder Gang sauber greift, muss die Zugspannung stimmen. Beim 6- und 12-Gang schaltet der rechte Hebel die Nabe und der linke die Ritzel.',
  wear:['Ein Gang rutscht durch oder springt, besonders beim kräftigen Antritt','Leerlauf beim Treten – die Pedale drehen durch','Gänge lassen sich nur schwer oder gar nicht schalten','Schaltkettchen geknickt, verdreht oder verrostet'],
  tasks:[
   {t:'Nabenschaltung einstellen',lv:2,iv:'wenn ein Gang rutscht und nach jedem Hinterradausbau',
    steps:['Rad entfaltet hinstellen. Das Schaltkettchen muss ganz in die Achse eingeschraubt sein.','In den höchsten Gang schalten, dann den rechten Schalthebel auf die mittlere Stellung. Dabei die Pedale etwas drehen, damit der Gang in der Nabe wirklich greift.','Durch das Loch in der Mutter rechts an der Achse schauen: Die kleine Stufe am Stift des Schaltkettchens soll bündig mit dem Achsende abschließen – höchstens etwa 1 mm darüber.','Passt es nicht: Kontermutter am Zug lösen, die Einstellhülse drehen, bis die Stufe bündig steht, und die Kontermutter wieder festdrehen.','Alle drei Gänge durchschalten und unter Last testen.'],
    tools:[],
    note:'So beschreibt es ein Brompton-Datenblatt für die 3-Gang-Nabe. Sehr alte Bromptons mit anderer Nabe werden anders eingestellt. Ein falsch eingestellter Gang kann unter Last durchrutschen – das kann einen Sturz verursachen.'},
   {t:'Schaltkettchen pflegen',lv:1,iv:'etwa monatlich',
    steps:['Ein paar Tropfen Kettenöl auf Gewinde und Glieder des Schaltkettchens geben – das empfiehlt Brompton zusammen mit den Faltgelenken.','Überschuss abwischen.','Prüfen, dass das Kettchen gerade aus der Achse kommt und der Zug nicht scheuert.'],
    tools:['oel','lappen']}
  ],
  shop:'Ein Gang rutscht trotz korrekter Einstellung durch, die Nabe macht mahlende Geräusche, oder das Schaltkettchen ist beschädigt. Das Innenleben der Nabe ist Händlersache.'},

  ],
  shop:'Kurbelausbau und Kettenblattwechsel, wenn du dein Kurbelsystem nicht kennst, oder Knacken, das du nicht findest.'},

 {id:'pedal',n:'Pedale',g:'Antrieb',a:[510,640],l:[620,690],z:[505,635],zw:200,

 /* -------- BREMSEN -------- */
 {id:'bremse',n:'Felgenbremse',lab:'Bremse',g:'Bremsen',a:[740,490],l:[595,585],z:[735,485],zw:240,

  how:'Die {{Felgenbremse}} ist eine Doppelgelenkbremse: Der Bremszug zieht zwei Arme zusammen, die Beläge klemmen die Felge. Mit der Einstellschraube gleichst du Belagverschleiß aus, mit der Zentrierschraube oben am Bremssattel die Seiten. Weil die Beläge auch die Felge abschleifen, gehört der {{Felgenverschleiß}} zur Kontrolle. Öl oder Fett auf Felge und Belägen verringert die Bremswirkung stark.',
  wear:['Rillen im Belag fast verschwunden','Quietschen oder schleifende Geräusche','Hebel lässt sich weit ziehen, bevor die Bremse greift','Felgenflanke mit tiefen Riefen oder sichtbar hohl gebremst'],

    tools:[]},
   {t:'Felge prüfen und reinigen',lv:1,iv:'bei jeder Inspektion',
    steps:['Bremsflanken mit einem sauberen Tuch und etwas Isopropanol abwischen.','Mit dem Finger über die Flanke fahren: Eine deutlich hohl gebremste Flanke oder tiefe Riefen sind ein Warnzeichen.','Hat deine Felge eine Verschleißmarkierung (Rille oder Punkt), auf diese achten.'],
    tools:['iso','lappen','handschuhe'],
    note:'Ob die Brompton-Felgen eine Verschleißmarkierung haben, konnte ich nicht sicher herausfinden. Im Zweifel lass die Wandstärke beim Händler messen.'},
   {t:'Bremse nachstellen',lv:1,iv:'wenn der Hebel zu weit durchgeht',
    steps:['Einstellschraube am Bremshebel oder am Bremssattel in kleinen Schritten herausdrehen – das verkürzt den Leerweg.','Der Hebel soll deutlich vor dem Lenker fest werden. Im Ruhezustand dürfen die Beläge die Felge nicht berühren.','Rad drehen und horchen. Schleift ein Belag einseitig: mit der Zentrierschraube oben am Bremssattel ausgleichen.'],

   {t:'Beläge wechseln',lv:2,iv:'wenn die Rillen abgefahren sind',

 /* -------- LAUFRÄDER -------- */
 {id:'reifen',n:'Reifen',g:'Laufräder',a:[872,523],l:[930,430],z:[794,602],zw:440,
  short:'16 Zoll: Grip, Komfort und Pannenschutz',
  what:'Das C Line rollt auf kleinen 16-Zoll-Reifen (35-349). Serienmäßig sind laut Händlerangaben Schwalbe Marathon Racer montiert.',
  how:'Kleine Räder brauchen vergleichsweise viel Druck, damit sie leicht rollen und der Schlauch nicht an Kanten eingeklemmt wird. Der Reifen sitzt mit seinem Wulst in der Felge, innen hält ein Schlauch die Luft. Beim Ventil findest du am Brompton beide Typen ({{Schrader und Presta}}) – schau nach, was bei dir verbaut ist.',
  wear:['Abgefahrenes Profil oder flach gefahrene Mitte, vor allem hinten','Risse oder poröse Stellen an der Flanke','Schnitte, Splitter oder Glasscherben in der Lauffläche','Häufige Platten – oft zu wenig Druck'],
  tasks:[
   {t:'Luftdruck prüfen',lv:1,iv:'mindestens wöchentlich messen',

function spokes(cx,cy,g,n,r0,r1){
  for(let i=0;i<n;i++){
    const a=i*2*Math.PI/n, off=(i%2?1:-1)*0.42;
    const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',cx+r0*Math.cos(a+off));l.setAttribute('y1',cy+r0*Math.sin(a+off));
    l.setAttribute('x2',cx+r1*Math.cos(a));l.setAttribute('y2',cy+r1*Math.sin(a));
    l.setAttribute('class','spk');g.appendChild(l);
  }
}
Object.values(BIKES).forEach(b=>b.spokes.forEach(([cx,cy,id,n,r0,r1])=>spokes(cx,cy,document.getElementById(id),n,r0,r1)));

const L=$('#labels');
function buildLabels(){
 L.replaceChildren();labelsDirty=true;
 PARTS.forEach(p=>{
  const line=document.createElementNS(NS,'line');
  line.setAttribute('class','lead');line.dataset.for=p.id;line.setAttribute('x1',p.l[0]);line.setAttribute('y1',p.l[1]);
  line.setAttribute('x2',p.a[0]);line.setAttribute('y2',p.a[1]);L.appendChild(line);
  const dot=document.createElementNS(NS,'circle');
  dot.setAttribute('class','dot');dot.setAttribute('cx',p.a[0]);dot.setAttribute('cy',p.a[1]);dot.setAttribute('r',9);
  dot.dataset.part=p.id;dot.id='d-'+p.id;L.appendChild(dot);
  const g=document.createElementNS(NS,'g');g.setAttribute('class','lbl');g.dataset.part=p.id;g.id='l-'+p.id;
  g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',p.n);
  const r=document.createElementNS(NS,'rect');r.setAttribute('rx',22);
  const t=document.createElementNS(NS,'text');t.setAttribute('x',p.l[0]);t.setAttribute('y',p.l[1]);
  t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','central');t.textContent=p.lab||p.n;
  g.appendChild(r);g.appendChild(t);L.appendChild(g);
 });
 if(!$('#v-rad').hidden)sizeLabels();
}
/* Misst die Beschriftungen – geht nur, solange die Rad-Ansicht sichtbar ist. */
function sizeLabels(){
  let ok=false;
  L.querySelectorAll('.lbl').forEach(g=>{
    const t=g.querySelector('text'),r=g.querySelector('rect');let b;
    try{b=t.getBBox()}catch(e){return}
    if(!b.width)return;
    ok=true;
    const p=byId[g.dataset.part];
    const x0=p.l[0]-b.width/2;let sh=0;
    if(x0-16<4)sh=4-(x0-16); if(x0+b.width+16>996)sh=996-(x0+b.width+16);t.setAttribute('x',p.l[0]+sh);
    const ln=L.querySelector('line[data-for="'+p.id+'"]');if(ln)ln.setAttribute('x1',p.l[0]+sh);
    b=t.getBBox();
    r.setAttribute('x',b.x-16);r.setAttribute('y',b.y-6);r.setAttribute('width',b.width+32);r.setAttribute('height',b.height+12);
  });
  if(ok)labelsDirty=false;
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{labelsDirty=true;if(!$('#v-rad').hidden)sizeLabels()});

function setVB(a){vb=a;svg.setAttribute('viewBox',a.map(n=>n.toFixed(1)).join(' '))}
function animVB(to){
  cancelAnimationFrame(animVB.raf);
  if(reduced){setVB(to);return}
  const from=vb.slice(),t0=performance.now(),D=450;
  const step=now=>{let k=Math.min(1,(now-t0)/D);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    setVB(from.map((f,i)=>f+(to[i]-f)*k));if(k<1)animVB.raf=requestAnimationFrame(step)};
  animVB.raf=requestAnimationFrame(step);
}
/* Wechselt die Bühnengröße (Übersicht <-> Detail), den sichtbaren Ausschnitt
   im gleichen Maßstab halten – sonst springt das Bild erst und zoomt dann. */
function keepScale(before){
  const after=stage.getBoundingClientRect();
  if(!before.width||!after.width)return;
  const upp=vb[2]/before.width;
  const w=after.width*upp,h=after.height*upp;
  const cx=vb[0]+vb[2]/2,cy=vb[1]+vb[3]/2;
  setVB([cx-w/2,cy-h/2,w,h]);
}
function targetFor(p){
  const r=stage.getBoundingClientRect();const a=r.height/Math.max(1,r.width);
  const w=p.zw||320,h=w*a;return [p.z[0]-w/2,p.z[1]-h/2,w,h];
}
function highlight(id){
  document.querySelectorAll('svg .part').forEach(g=>g.classList.toggle('on',g.dataset.part===id));
  document.querySelectorAll('svg .lbl,svg .dot').forEach(g=>g.classList.toggle('on',g.dataset.part===id));
}

function go(hash){if(location.hash===hash)route();else location.hash=hash}

/* ======================= ROUTER ======================= */
function route(){
  let h=(location.hash||'#/rad').slice(2).split('/');
  if(!bike&&h[0]!=='start'){try{history.replaceState(null,'','#/start')}catch(e){}h=['start']}
  const v=h[0]||'rad';
  const map={start:'v-start',rad:'v-rad',inspektion:'v-insp',werkzeug:'v-tools',begriffe:'v-gloss'};
  const vid=map[v]||'v-rad';
  document.querySelectorAll('.view').forEach(s=>s.hidden=s.id!==vid);
  $('#switch').hidden=!bike||vid==='v-start';
  document.querySelectorAll('.tabs button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.go==='#/'+(map[v]?v:'rad')));
  document.querySelectorAll('.tabs button[aria-current]').forEach(b=>b.setAttribute('aria-current','page'));
  if(vid==='v-rad'){
    if(labelsDirty)sizeLabels();
    const p=byId[h[1]];const rad=$('#v-rad');
    const wasDetail=rad.classList.contains('detail');
    const before=stage.getBoundingClientRect();
    if(p){
      const changed=current!==p.id;current=p.id;
      rad.classList.add('detail');renderDetail(p);highlight(p.id);
      if(changed)window.scrollTo(0,0);
      if(!wasDetail)keepScale(before);
      animVB(targetFor(p));
    }else{
      current=null;rad.classList.remove('detail');renderOverview();highlight(null);
      if(wasDetail)keepScale(before);
      animVB(BASE);
    }
  }
  if(vid==='v-start')renderStart();
  if(vid==='v-insp')renderInsp();
  if(vid==='v-tools')renderTools();
  if(vid==='v-gloss')renderGloss();
  if(vid!=='v-rad')window.scrollTo(0,0);
}
addEventListener('hashchange',route);
addEventListener('resize',()=>{if(current)setVB(targetFor(byId[current]))});

/* ======================= EVENTS ======================= */
document.addEventListener('click',e=>{
  const pick=e.target.closest('[data-pick]');
  if(pick){store.set('bike',pick.dataset.pick);setBike(pick.dataset.pick);toast(bike.n+' gewählt');go('#/rad');return}
  const lnk=e.target.closest('[data-go]');
  if(lnk){
    if(lnk.dataset.tabset)dtab=1;
    location.hash=lnk.dataset.go;closeSheet();return;
  }
  const part=e.target.closest('svg [data-part]');
  if(part){location.hash='#/rad/'+part.dataset.part;return}
  const tab=e.target.closest('[data-tab]');
  if(tab){dtab=+tab.dataset.tab;renderDetail(byId[current]);return}
  const term=e.target.closest('.term');
  if(term){const k=term.dataset.term;openSheet(`<h3>${esc(k)}</h3><p>${esc(ALLGLOSS[k]||'Keine Erklärung hinterlegt.')}</p><button class="btn ghost" data-act="close">Schließen</button>`);return}
  const tl=e.target.closest('[data-tool]');
  if(tl){const id=tl.dataset.tool,t=TOOLS[id];
    openSheet(`<h3>${esc(t.n)}</h3><p>${esc(td(id))}</p><p style="color:var(--ink2);font-size:14px">${esc(KIND[t.k])}</p>
    <ul class="cl"><li><input type="checkbox" id="s-${id}" data-own="${id}"${owned.has(id)?' checked':''}><label for="s-${id}">Hab ich</label></li></ul>
    <div class="btnrow"><button class="btn ghost" data-act="close">Schließen</button></div>`);return}
  const act=e.target.closest('[data-act]');
  if(act){const a=act.dataset.act;
    if(a==='close')closeSheet();
    if(a==='mdpart')copyMd(mdPart(byId[current]),current+'.md');
    if(a==='mdinsp')copyMd(mdInsp(),'inspektion.md');
    if(a==='mdtools')copyMd(mdTools(false),'werkzeug.md');
    if(a==='mdshop')copyMd(mdTools(true),'einkaufsliste.md');
    if(a==='resetinsp'){if(confirm('Alle Häkchen der Inspektion zurücksetzen?')){checks={};store.set(bike.ck,checks);renderInsp()}}
    if(a==='dlmd'&&dl){dl.save({filename:act.dataset.fn,data:copyMd.last}).catch(()=>toast('Speichern abgebrochen'))}
  }
});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('svg .lbl')){e.preventDefault();location.hash='#/rad/'+e.target.closest('svg .lbl').dataset.part}
});
document.addEventListener('change',e=>{
  const o=e.target.dataset&&e.target.dataset.own;
  if(o){e.target.checked?owned.add(o):owned.delete(o);store.set('owned',[...owned]);
    document.querySelectorAll(`[data-own="${o}"]`).forEach(x=>x.checked=owned.has(o));
    document.querySelectorAll(`.chip[data-tool="${o}"]`).forEach(x=>x.classList.toggle('have',owned.has(o)));
    if(!$('#v-tools').hidden)renderTools();return}
  const c=e.target.dataset&&e.target.dataset.chk;
  if(c){checks[c]=e.target.checked;if(!e.target.checked)delete checks[c];store.set(bike.ck,checks);
    const i=+c.split('-')[0];openSteps.add(i);renderInsp();}
});
document.addEventListener('toggle',e=>{
  const d=e.target;if(d.classList&&d.classList.contains('step')){const i=+d.dataset.step;d.open?openSteps.add(i):openSteps.delete(i)}
},true);

setBike(store.get('bike',null));
route();
initDownloads();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
